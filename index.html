<!DOCTYPE html>
<html lang="ro">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Șantiere</title>
<meta name="apple-mobile-web-app-title" content="Șantiere">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#f2f2f7; --card:#ffffff; --card2:#f7f7fa; --text:#1b1b1b; --muted:#5f6670; --line:#d9dee5;
  /* paleta rapoartelor lui Cătălin (RAPOARTE CĂTĂLIN, 24.11.2026): navy #1e3a5f, verde #2e7d5b, roșu #c62828,
     portocaliu #e08a00, caseta „Pe scurt” #f1f5fa, rând TOTAL #eef2f7, linii #d9dee5, text #1b1b1b */
  --accent:#1e3a5f; --accent-text:#ffffff; --navy:#1e3a5f; --navy-t:#1e3a5f; --navy-text:#ffffff; --green:#2e7d5b; --yellow:#b86e00; --red:#c62828;
  --pescurt:#f1f5fa; --totalbg:#eef2f7;
  --fundal:radial-gradient(110% 55% at 100% 0%,rgba(46,125,91,.20) 0%,transparent 62%),radial-gradient(120% 70% at 0% 0%,rgba(30,58,95,.26) 0%,transparent 66%),radial-gradient(90% 50% at 50% 100%,rgba(224,138,0,.08) 0%,transparent 70%),linear-gradient(180deg,#dde6f1 0%,#eef1f6 50%,#f3f4f7 100%);
  --green-bg:#e3f1ea; --yellow-bg:#fdf0db; --red-bg:#fbe4e4; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --card:#1c1c1f; --card2:#26262a; --text:#f4f4f6; --muted:#a0a0aa; --line:#33333a;
    --accent:#4f7ab8; --navy:#4f7ab8; --navy-t:#9dbbe3; --navy-text:#ffffff; --green:#4cb98a; --yellow:#f0a030; --red:#ef5350;
    --pescurt:#141d28; --totalbg:#1c2836;
    --fundal:radial-gradient(120% 60% at 100% 0%,rgba(76,185,138,.12) 0%,transparent 60%),radial-gradient(120% 70% at 0% 0%,rgba(79,122,184,.22) 0%,transparent 65%),linear-gradient(180deg,#0b1320 0%,#05080d 50%,#000 100%);
    --green-bg:#12301f; --yellow-bg:#3a2a0c; --red-bg:#3d1614; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{background:var(--bg) var(--fundal) no-repeat fixed}
html,body{margin:0;color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;}
body{min-height:100vh;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:640px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 55%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px 16px 10px;margin:0 -16px 6px}
.refr{flex:none;color:var(--navy-t);display:flex;align-items:center;justify-content:center}
.refr.rot svg{animation:rot .8s linear infinite}
.refr svg{transition:transform .1s}
.refr.rosu{background:var(--red-bg);color:var(--red)}
.refr.verde{background:var(--green-bg);color:var(--green)}
nav.tabs button{position:relative}
nav.tabs .cnt{position:absolute;top:6px;left:calc(50% + 6px);min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;line-height:20px;text-align:center}
@keyframes rot{to{transform:rotate(360deg)}}
header.top h1{font-size:28px;line-height:1.15;margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
.upd{font-size:14px;color:var(--muted);margin-top:4px}
.probe{background:var(--yellow-bg);color:var(--text);font-size:14px;padding:8px 12px;border-radius:12px;margin:8px 0}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:10px 0;box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.big{font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.label{font-size:14px;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.btn{min-height:48px;border:0;border-radius:14px;padding:0 18px;font-weight:600;cursor:pointer;
  background:var(--card2);transition:transform .12s ease,opacity .12s ease}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.danger{background:var(--red-bg);color:var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.add{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:6;
  height:56px;padding:0 22px;border-radius:28px;box-shadow:0 6px 20px rgba(30,58,95,.35)}
.day{font-size:15px;font-weight:700;color:var(--navy-t);margin:20px 4px 8px;padding-bottom:4px;border-bottom:1.5px solid var(--navy-t)}
.day::first-letter{text-transform:uppercase}
.item{background:var(--card);border-radius:16px;padding:14px 16px;margin:8px 0;box-shadow:var(--shadow);
  cursor:pointer;width:100%;text-align:left;border:0;display:block}
.item:active{transform:scale(.99)}
/* rândul + butonul ⋯ alături, în afara dreptunghiului */
.lr{display:flex;align-items:center;gap:6px;margin:8px 0}
.lr .item{flex:1;min-width:0;margin:0}
.drag{flex:none;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--muted);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.srt.trag{position:relative;z-index:5;box-shadow:0 10px 28px rgba(20,35,60,.22);border-radius:16px;opacity:.95}
.pickbtn{width:100%;min-height:50px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;font-size:17px;text-align:left;cursor:pointer}
.spick{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px;margin-top:6px}
.spick .srt{display:flex;align-items:center;gap:4px;background:var(--card)}
.pkname{flex:1;min-height:46px;border:0;background:transparent;text-align:left;font-size:17px;font-weight:600;padding:0 10px;border-radius:10px;cursor:pointer}
.pkname.on{background:var(--card2);color:var(--navy-t)}
.field .drag{display:flex;margin:0;font-size:24px}
.field .pickbtn span{display:inline;margin:0;font-size:17px;color:var(--text)}
.field .pickbtn span.muted{color:var(--muted);font-size:14px}
.field .spick .small{display:block}
.more{flex:none;width:44px;height:44px;border:0;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;padding:0;border-radius:22px}
.more span{width:5px;height:5px;border-radius:50%;background:var(--navy-t);opacity:.55;transition:opacity .15s ease}
.more:hover span,.more:focus-visible span{opacity:1}
.more:active{background:color-mix(in srgb,var(--navy) 10%,transparent)}
/* norișorul */
.pop{position:absolute;z-index:30;min-width:150px;background:var(--card);border-radius:16px;padding:6px;
  box-shadow:0 10px 30px rgba(20,35,60,.18),0 2px 6px rgba(20,35,60,.08);border:1px solid var(--line);
  opacity:0;transform:scale(.92) translateY(-4px);transform-origin:top right;transition:opacity .15s ease,transform .15s ease}
.pop.show{opacity:1;transform:none}
.pop button{display:block;width:100%;min-height:44px;border:0;background:transparent;text-align:left;padding:0 14px;border-radius:11px;font-weight:600;font-size:16px;cursor:pointer;color:var(--text)}
.pop button:hover,.pop button:focus-visible{background:var(--card2);outline:none}
.pop button.rosu{color:var(--red)}
.item .t{font-weight:600;font-size:17px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--muted)}
.chip.g{background:var(--green-bg);color:var(--green)}
.nrow{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line,rgba(127,127,127,.18))}
.nb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:13px;font-weight:700;color:#fff;letter-spacing:0}
.btn.lipeste{margin:2px 0 6px}
.card.lp{margin-bottom:10px} .card.lp.gresit{border:1px solid var(--red)}
.field textarea{min-height:150px;padding:12px;resize:vertical}
.nb.r{background:var(--red)} .nb.g{background:var(--green)}
.ntxt{min-width:0;flex:1;font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ntxt.nou{color:var(--text,inherit);font-weight:600}
.chip.y{background:var(--yellow-bg);color:var(--yellow)}
.chip.r{background:var(--red-bg);color:var(--red)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex:none}
.dot.g{background:var(--green)}.dot.y{background:var(--yellow)}.dot.r{background:var(--red)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.cell{background:var(--card2);border-radius:12px;padding:10px 12px}
.cell .v{font-weight:700;font-size:18px}
.up{color:var(--green);font-weight:600}.down{color:var(--red);font-weight:600}
.seg{display:flex;background:var(--card2);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;gap:8px;margin:12px 0}
.nav .lbl{flex:1;text-align:center;font-weight:600}
.icon{width:44px;height:44px;border-radius:12px;border:0;background:var(--card);font-size:22px;cursor:pointer;box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chips button{flex:none;min-height:40px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-weight:600;cursor:pointer}
.chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;display:flex;justify-content:center;
  background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs button{flex:1;min-height:60px;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:600;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
nav.tabs button.on{color:var(--accent)}
nav.tabs svg{width:24px;height:24px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
/* foaie de jos (formular) */
.back{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;opacity:0;transition:opacity .2s ease}
.back.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--bg);border-radius:22px 22px 0 0;
  max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .22s ease;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom))}
.sheet.show{transform:none}
.sheet .in{max-width:640px;margin:0 auto}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet h2{font-size:22px;margin:4px 0 12px}
.field{display:block;margin:12px 0}
.field span{display:block;font-size:14px;color:var(--muted);margin:0 0 6px 4px}
.field input,.field select,.field textarea{width:100%;min-height:50px;border:1px solid var(--line);border-radius:14px;
  background:var(--card);padding:12px 14px;font-size:17px;outline:none;-webkit-appearance:none;appearance:none}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.crows{background:var(--card);border-radius:14px;padding:2px 14px;margin:12px 0 8px}
.crow{display:flex;align-items:center;gap:10px;min-height:54px;border-bottom:1px solid var(--line)}
.crow:last-child{border-bottom:0}
.crow span{flex:1;font-size:16px}
.crow input{width:120px;min-height:44px;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:8px 10px;font-size:17px;text-align:right;outline:none;font-variant-numeric:tabular-nums}
.crow input:focus{border-color:var(--accent)}
.crow em{font-style:normal;color:var(--muted);width:12px}
.pbox{background:var(--card);border-radius:14px;padding:12px 14px;margin:12px 0}
.plabel{font-size:14px;color:var(--muted);margin-bottom:6px}
.prow{display:flex;align-items:center;gap:8px}
.pv{font-size:20px;font-weight:700}
.pin{flex:1;min-width:0;min-height:46px;border:1px solid var(--accent);border-radius:12px;background:var(--bg);padding:8px 12px;font-size:18px;outline:none}
.pbtn{flex:none;width:44px;height:44px;border-radius:22px;border:0;font-size:20px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pbtn.pen{background:var(--card2)}
.pbtn.ok{background:var(--green);color:#fff}
.pbtn.no{background:var(--red-bg);color:var(--red)}
.pbtn:active{transform:scale(.94)}
.pbox .chips{margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .field{margin:6px 0}
.live{background:var(--card);border-radius:14px;padding:12px 14px;margin:12px 0}
.live .row{justify-content:space-between;min-height:30px}
.actions{display:grid;gap:10px;margin-top:16px}
.err{color:var(--red);font-size:15px;min-height:20px;margin:6px 4px}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-140%);z-index:40;
  background:var(--text);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;transition:transform .2s ease,opacity .2s ease;max-width:90vw;
  opacity:0;visibility:hidden}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.login{max-width:420px;margin:0 auto;padding:12vh 20px 40px}
.login h1{font-size:32px;margin:0 0 6px;letter-spacing:-.02em}
.legend{display:grid;gap:8px;margin-top:8px}
.card.total{background:var(--pescurt);border-left:5px solid var(--navy);box-shadow:none;padding:12px 14px}
.card.total .big{font-size:28px}
.card.total table.tot{font-size:14px;margin-top:6px!important}
.card.total table.tot td{padding:5px 0}
.card.total .label{color:var(--navy-t);font-weight:600}
.card.total .big{color:var(--navy-t)}
.ps{background:var(--card);border-radius:16px;padding:12px 16px;margin:8px 0;box-shadow:var(--shadow);border-left:4px solid var(--navy);cursor:pointer}
.ps-n{font-weight:600;font-size:17px}
.ps-r{font-weight:700;font-size:18px}
.ps-d{font-size:14px;color:var(--muted);margin-top:2px}
.ps-tot{background:var(--totalbg);color:var(--navy-t);cursor:default;box-shadow:none}
.ps-tot .ps-n,.ps-tot .ps-r{font-weight:800}
table.tot{width:100%;border-collapse:collapse;font-size:15px}
table.tot td{padding:8px 0;border-bottom:1px solid var(--line)}
table.tot td:last-child{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- prima pornire -->
<section id="vSetup" class="login hidden">
  <h1>Prima pornire</h1>
  <p class="muted">Alege cele două parole. Fiecare intră cu parola lui. Le poți schimba oricând din Setări.</p>
  <label class="field"><span>Parola lui Silviu</span><input id="pS" type="password" autocomplete="new-password"></label>
  <label class="field"><span>Parola lui Cătălin</span><input id="pC" type="password" autocomplete="new-password"></label>
  <div class="err" id="eSetup"></div>
  <button class="btn primary block" id="bSetup">Salvează parolele</button>
</section>

<!-- intrare -->
<section id="vLogin" class="login hidden">
  <h1>Șantiere</h1>
  <p class="muted">Pune parola ta.</p>
  <form id="fLogin">
    <label class="field"><span>Parola</span><input id="pL" type="password" autocomplete="current-password"></label>
    <div class="err" id="eLogin"></div>
    <button class="btn primary block" type="submit" id="bLogin">Intră</button>
  </form>
</section>

<section id="vLoad" class="login"><p class="muted">Se încarcă…</p></section>

<!-- aplicația -->
<div id="vApp" class="hidden">
  <div class="wrap">
    <header class="top">
      <div class="row"><h1 id="title" class="grow">Cine a lucrat și cât</h1>
      <button class="icon refr" id="bRefr" aria-label="Reîmprospătează datele" title="Reîmprospătează"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></svg></button></div>
      <div class="upd" id="upd"></div>
    </header>
    <div id="probe" class="probe hidden">Mod de probă pe calculator: datele stau doar în acest browser.</div>
    <main id="main"></main>
  </div>
  <button class="btn primary add" id="bAdd">+ Adaugă</button>
  <nav class="tabs" aria-label="Secțiuni"><div class="in">
    <button data-tab="lucru" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M17 11h4M19 9v4"/></svg>Pontaj</button>
    <button data-tab="bani"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/></svg>Costuri</button>
    <button data-tab="rezumat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-7"/></svg>Rezumat</button>
    <button data-tab="setari"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Setări</button>
  </div></nav>
</div>

<div id="back" class="back hidden"></div>
<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true"><div class="in" id="sheetIn"></div></div>

<script>
/* =================== legătura cu serverul =================== */
/* Trei moduri: în Google (google.script), pe orice alt site (prin adresa de mai jos, fără conturi Google),
   sau probă locală pe calculator (datele stau doar în browser). */
var API_URL = 'https://script.google.com/macros/s/AKfycbz5UJCQkUXW2CVaADy0UbLGnbZV5cQzoQuYliy3Tpom6SA76PUH-D4Y60LDqFQQyywclA/exec';
var IN_GOOGLE = (typeof google !== 'undefined' && google.script && google.script.run);
var LOCAL = !IN_GOOGLE && /^(localhost|127\.0\.0\.1|)$/.test(location.hostname);
var Mock = (function(){
  function ld(){ try{ return JSON.parse(localStorage.getItem('mockSantiere')||'null'); }catch(e){ return null; } }
  function sv(d){ try{ localStorage.setItem('mockSantiere', JSON.stringify(d)); }catch(e){} }
  function db(){ var d = ld(); if(!d){ d = {pw:null, lucru:[], costuri:[], santiere:[
      {id:'s1',nume:'Șantier A',tarif_ora:'30',pret_metru:'20',activ:'da',contrib_ora:'1'},
      {id:'s2',nume:'Șantier B',tarif_ora:'30',pret_metru:'',activ:'da',contrib_ora:'1'}], act:''}; sv(d);} return d; }

/* =================== Excel pe lună (Silviu, 24.11.2026: „ABSOLUT DA, BUTON”) ===================
   Un fișier .xlsx cu luna aleasă, ca să-l încarce Cătălin în Claude sau Grok.
   Foi: Citește-mă · Rezumat · Pe zile · Pontaj. Cifrele sunt numere (nu text), ca să se poată calcula. */
var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function incarcaXlsx(){
  if(window.XLSX) return Promise.resolve(window.XLSX);
  if(incarcaXlsx._p) return incarcaXlsx._p;
  incarcaXlsx._p=new Promise(function(ok,nu){ var s=document.createElement('script'); s.src=XLSX_URL; s.onload=function(){ window.XLSX?ok(window.XLSX):nu(new Error('Librăria Excel nu a pornit.')); }; s.onerror=function(){ incarcaXlsx._p=null; nu(new Error('Nu pot încărca Excelul. Verifică internetul.')); }; document.head.appendChild(s); });
  return incarcaXlsx._p;
}
function r2(n){ return n==null? null : Math.round(n*100)/100; }
function dataRo(s){ var p=String(s).split('-'); return p[2]+'.'+p[1]+'.'+p[0]; }
function foaieExcel(luna){
  var y=+luna.slice(0,4), mo=+luna.slice(5,7), numeLuna=LUNI[mo-1]+' '+y;
  var g=grupuri().filter(function(x){ return x.data.slice(0,7)===luna; }).sort(function(a,b){ return a.data<b.data?-1:a.data>b.data?1:a.santier.localeCompare(b.santier); });
  var tot=totaluri(g), gen=generaleLuna(luna), names=santiereOrd().map(function(s){ return s.nume; });
  g.forEach(function(x){ if(names.indexOf(x.santier)<0) names.push(x.santier); });
  // Rezumat
  var rez=[['Rezumat '+numeLuna+' — toate șantierele'],[],['Șantier','Ore lucrate','Metri (m²)','Produs €','Cheltuieli șantier €','Rămas €','Rămas pe oră €']];
  names.forEach(function(n){ var t=totaluri(g.filter(function(x){ return x.santier===n; })); if(t.ore>0||t.cheltuieli>0) rez.push([n,r2(t.ore),r2(t.metri),r2(t.produs),r2(t.cheltuieli),r2(t.ramas),r2(t.peOra)]); });

/* Mutare cu degetul: se apucă de ≡, rândul urmează degetul, la ridicare se salvează ordinea. */
function sortabil(lista, gata){
  if(!lista) return;
  lista.querySelectorAll('.drag').forEach(function(h){
    h.onpointerdown=function(e){
      e.preventDefault();
      var rand=h.closest('.srt'), y0=e.clientY, mutat=false;
      rand.classList.add('trag'); h.setPointerCapture(e.pointerId);
      h.onpointermove=function(ev){
        var dy=ev.clientY-y0; rand.style.transform='translateY('+dy+'px)';
        var fr=Array.prototype.slice.call(lista.children).filter(function(x){ return x!==rand; });
        var mij=rand.getBoundingClientRect().top+rand.offsetHeight/2;
        for(var i=0;i<fr.length;i++){
          var r=fr[i].getBoundingClientRect();
          if(mij<r.top+r.height/2){            if(rand.nextSibling!==fr[i]){ var top0=rand.getBoundingClientRect().top; lista.insertBefore(rand,fr[i]); y0+= rand.getBoundingClientRect().top-top0; rand.style.transform='translateY('+(ev.clientY-y0)+'px)'; mutat=true; }
            return; }
        }
        if(lista.lastChild!==rand){ var t0=rand.getBoundingClientRect().top; lista.appendChild(rand); y0+=rand.getBoundingClientRect().top-t0; rand.style.transform='translateY('+(ev.clientY-y0)+'px)'; mutat=true; }
      };
      h.onpointerup=h.onpointercancel=function(){
        h.onpointermove=null; h.onpointerup=null; h.onpointercancel=null;
        rand.classList.remove('trag'); rand.style.transform='';
        if(mutat) gata(Array.prototype.map.call(lista.querySelectorAll('.srt'), function(x){ return x.dataset.id; }));
      };
    };
  });
}

/* =================== Lipește din Claude / Grok (Silviu, 25.11.2026: „ok atunci fă butonul”) ===================
   Cătălin îi spune lui Claude/Grok ce a lucrat; primește blocuri PONTAJ … SFÂRȘIT; le lipește aici, le vede și apasă Salvează. */
function faraDiacritice(s){ return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim(); }
function numarText(s){ var m=String(s||'').replace(/\s/g,'').replace(',','.').match(/-?\d+(\.\d+)?/); return m? parseFloat(m[0]) : null; }
function citesteBlocuri(text){
  var t=String(text||'').replace(/\r/g,''), rez=[];
  var bucati=t.split(/^\s*\**\s*PONTAJ\s*\**\s*$/im).slice(1);
  if(!bucati.length && /data\s*:/i.test(t)) bucati=[t];          // un singur bloc fără titlu
  bucati.forEach(function(b, i){
    b=b.split(/^\s*\**\s*SF[AÂ]R[SȘŞ]IT\s*\**\s*$/im)[0];
    var c={}; b.split('\n').forEach(function(ln){ var m=ln.replace(/^[\s*\-•]+/,'').match(/^([^:]{2,30}):\s*(.*)$/); if(m) c[faraDiacritice(m[1]).replace(/[^a-z² ]/g,'').trim()]=m[2].replace(/\*+/g,'').trim(); });
    var r={nr:i+1, erori:[]}, dm=String(c['data']||'').match(/(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{2,4})/);
    if(dm){ var an=+dm[3]; if(an<100) an+=2000; r.data=an+'-'+pad(+dm[2])+'-'+pad(+dm[1]); if(isNaN(parseIso(r.data).getTime())) { r.data=''; } }
    if(!r.data) r.erori.push('data lipsește sau nu se înțelege');
    var sn=faraDiacritice(c['santier']), s=(S.data.santiere||[]).find(function(x){ return faraDiacritice(x.nume)===sn; });
    if(s) r.santier=s.nume; else r.erori.push(c['santier']?'șantierul „'+c['santier']+'” nu e în listă':'șantierul lipsește');
    var tp=faraDiacritice(c['tip']); r.tip= /metr|^m$|mp|m²/.test(tp) ? 'metru' : 'ora';
    r.persoane=numarText(c['persoane']); r.ore=numarText(c['ore']); r.metri=numarText(c['metri']);
    if(r.persoane==null) r.erori.push('persoanele lipsesc');
    if(r.ore==null) r.erori.push('orele lipsesc');
    if(r.tip==='metru' && r.metri==null) r.erori.push('metrii lipsesc');
    var pm=numarText(c['pret pe m²']!=null?c['pret pe m²']:c['pret pe m']);
    r.pret_metru = (r.tip==='metru' && pm!=null && !(s && has(s.pret_metru) && num(s.pret_metru)===pm)) ? String(pm) : '';
    r.nota=c['nota']&&!/^(gol|-|—|nimic)$/i.test(c['nota'])?c['nota']:'';
    r.dublura = !!(r.data && r.santier && S.data.lucru.some(function(x){ return x.data===r.data && x.santier===r.santier && num(x.ore)===r.ore && num(x.persoane)===r.persoane; }));
    rez.push(r);
  });
  return rez;
}

    .then(function(d){
      INCURS--;
      if(d && d.lucru){ if(INCURS===0) primeste(d); }          // răspuns complet (proba locală)
      else if(d && d.actualizat && S.data){ S.data.actualizat=d.actualizat; pastreaza(); }  // răspuns scurt: ecranul e deja la zi

  S.data.actualizat=new Date().toISOString(); pastreaza();
  inchide(); render(); toast('Șters');
  lista.forEach(function(o){ trimite('sterge',{foaie:o.foaie,id:o.id}); });
}
/* Pontajul și cheltuielile sunt legate de aceeași zi și același șantier:
   când pleacă ultimul rând de pontaj al zilei, pleacă și cheltuielile ei. */
function eliminaPontaj(r){
  var ramase=S.data.lucru.filter(function(x){ return x.id!==r.id && x.data===r.data && x.santier===r.santier; });
  var c=costPentru(r.data,r.santier), lista=[{foaie:'Lucru',id:r.id}];
  var q='Elimini pontajul '+r.santier+', '+zi(r.data)+'?';
  if(!ramase.length && c){ lista.push({foaie:'Costuri',id:c.id}); q='Elimini pontajul '+r.santier+', '+zi(r.data)+'? Pleacă și cheltuielile acestei zile ('+eur(costTotal(c))+').'; }
  if(!confirm(q)) return;
  stergeMulte(lista);
}
function eliminaZiua(data,sant){
  var lista=S.data.lucru.filter(function(x){ return x.data===data && x.santier===sant; }).map(function(x){ return {foaie:'Lucru',id:x.id}; });
  var c=costPentru(data,sant); if(c) lista.push({foaie:'Costuri',id:c.id});
  if(!lista.length) return;
  if(!confirm('Elimini toată ziua '+sant+', '+zi(data)+': pontajul și cheltuielile?')) return;
  stergeMulte(lista);
}
function v(id){ var e=$(id); return e? e.value.trim() : ''; }

/* ---- Lucru ---- */
function formLucru(r){
  var nou=!r; r=r||{data:todayIso(),santier:(santiereOrd().find(function(s){return s.activ!=='nu';})||{}).nume||'',tip:'ora',persoane:'',ore:'',metri:'',nota:''};
  deschide('<h2>'+(nou?'Cine a lucrat și cât':'Modifică ziua')+'</h2>'+
    '<label class="field"><span>Data</span><input id="lData" type="date" value="'+esc(r.data)+'"></label>'+
    santierPick('lSant', r.santier)+
    '<div class="field"><span>Cum se plătește</span><div class="seg" id="lTip"><button type="button" data-v="ora" class="'+(r.tip!=='metru'?'on':'')+'">La oră</button><button type="button" data-v="metru" class="'+(r.tip==='metru'?'on':'')+'">La metru</button></div></div>'+
    '<div class="two"><label class="field"><span>Persoane</span><input id="lPers" inputmode="numeric" value="'+esc(r.persoane)+'" placeholder="ex. 3"></label>'+
    '<label class="field"><span>Ore totale</span><input id="lOre" inputmode="decimal" value="'+esc(r.ore)+'" placeholder="ex. 24"></label></div>'+
    '<div id="lOraF"><div class="pbox" id="boxOra"></div></div>'+
    '<div id="lMetriF"><label class="field"><span>Metri făcuți (m²)</span><input id="lMetri" inputmode="decimal" value="'+esc(r.metri)+'" placeholder="ex. 60"></label>'+
    '<div class="pbox" id="boxMetru"></div></div>'+
    '<label class="field"><span>Notă (dacă e nevoie)</span><input id="lNota" value="'+esc(r.nota)+'"></label>'+
    '<div class="live" id="lLive"></div><div class="err" id="fErr"></div>'+
    '<div class="actions"><button class="btn primary block" id="lSave">Salvează</button>'+(nou?'':'<button class="btn danger block" id="lDel">Șterge</button>')+'<button class="btn block" id="lCancel">Renunță</button></div>');
  var tip=r.tip==='metru'?'metru':'ora';
  /* Prețul: se vede prețul stabilit; ✏️ îl modifică doar pentru ziua asta; ✓ verde confirmă, ✕ roșu renunță
     sau readuce prețul stabilit (Silviu, 24.11.2026). Se salvează doar un preț diferit de cel stabilit. */
  var custom={ora: has(r.tarif_ora)?String(num(r.tarif_ora)):'', metru: has(r.pret_metru)?String(num(r.pret_metru)):''};
  var editing={ora:false, metru:false};
  function fixPret(kind){ var s=santier(v('lSant')); var k= kind==='ora'?'tarif_ora':'pret_metru'; return s&&has(s[k]) ? num(s[k]) : null; }
  function curPret(kind){ return has(custom[kind]) ? num(custom[kind]) : fixPret(kind); }
  function confirma(kind){
    var inp=$('pin_'+kind); if(!inp) return true;
    var val=num(inp.value); if(!(val>0)){ $('fErr').textContent='Scrie un preț mai mare ca zero.'; inp.focus(); return false; }
    var fix=fixPret(kind); custom[kind]= (fix!=null && val===fix) ? '' : String(val); editing[kind]=false; $('fErr').textContent=''; return true;
  }
  function box(kind){
    var el=$(kind==='ora'?'boxOra':'boxMetru'), fix=fixPret(kind), cur=curPret(kind), unit= kind==='ora'?'/oră':'/m²';
    var titlu= kind==='ora'?'Preț pe oră':'Preț pe m²';
    var modif=has(custom[kind]);
    if(editing[kind] || cur==null){
      var folosite=(kind==='ora'?tarifeFolosite:preturiFolosite)(v('lSant'));
      el.innerHTML='<div class="plabel">'+titlu+(fix!=null?' <span class="muted">· stabilit '+eur(fix)+'</span>':'')+'</div>'+
        '<div class="prow"><input id="pin_'+kind+'" class="pin num" inputmode="decimal" value="'+esc(cur!=null?virg(cur):'')+'" placeholder="scrie prețul"><span class="muted">€'+unit+'</span>'+
        '<button type="button" class="pbtn ok" id="pok_'+kind+'" aria-label="Confirmă prețul">✓</button>'+
        (cur!=null?'<button type="button" class="pbtn no" id="pno_'+kind+'" aria-label="Renunță">✕</button>':'')+'</div>'+
        (folosite.length?'<div class="chips">'+folosite.map(function(p){ return '<button type="button" data-p="'+p+'">'+eur(p)+unit+'</button>'; }).join('')+'</div>':'');
      el.querySelectorAll('.chips button').forEach(function(b){ b.onclick=function(){ $('pin_'+kind).value=virg(b.dataset.p); }; });
      $('pok_'+kind).onclick=function(){ if(confirma(kind)){ box(kind); upd(); } };
      if($('pno_'+kind)) $('pno_'+kind).onclick=function(){ editing[kind]=false; box(kind); upd(); };
      $('pin_'+kind).onkeydown=function(e){ if(e.key==='Enter'){ e.preventDefault(); $('pok_'+kind).click(); } };
    } else {
      el.innerHTML='<div class="plabel">'+titlu+'</div>'+
        '<div class="prow"><div class="pv num grow">'+eur(cur)+unit+' <span class="chip'+(modif?' y':'')+'">'+(modif?'modificat':'stabilit')+'</span></div>'+
        '<button type="button" class="pbtn pen" id="ppen_'+kind+'" aria-label="Modifică prețul">✏️</button>'+
        (modif?'<button type="button" class="pbtn no" id="prev_'+kind+'" aria-label="Înapoi la prețul stabilit">✕</button>':'')+'</div>'+
        (modif && fix!=null?'<div class="small muted">Prețul stabilit e '+eur(fix)+unit+'. ✕ îl readuce.</div>':'');
      $('ppen_'+kind).onclick=function(){ editing[kind]=true; box(kind); var i=$('pin_'+kind); if(i){ i.focus(); i.select(); } };
      if($('prev_'+kind)) $('prev_'+kind).onclick=function(){ custom[kind]=''; box(kind); upd(); };
    }
  }
  function upd(){
    $('lMetriF').classList.toggle('hidden', tip!=='metru');
    $('lOraF').classList.toggle('hidden', tip!=='ora');
    var x={santier:v('lSant'),tip:tip,ore:v('lOre'),metri:v('lMetri'),pret_metru:custom.metru,tarif_ora:custom.ora}, p=produsRand(x), s=santier(x.santier);
    var pr= tip==='metru' ? pretMetru(x,s) : tarifOra(x,s);
    var reg = pr==null ? '' : (tip==='metru' ? nr(num(x.metri))+' m² × '+eur(pr) : nr(num(x.ore))+' ore × '+eur(pr));
    $('lLive').innerHTML='<div class="row"><span class="muted">Produs</span><b class="num">'+(p.lipsa?'<span class="down">'+(tip==='metru'?'pune prețul pe m² (✏️)':'pune prețul pe oră (✏️)')+'</span>':eur(p.v))+'</b></div>'+(reg?'<div class="small muted num">'+reg+'</div>':'');
  }
  $('lTip').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ tip=b.dataset.v; $('lTip').querySelectorAll('button').forEach(function(o){ o.classList.toggle('on',o===b); }); upd(); }; });
  ['lOre','lMetri'].forEach(function(id){ $(id).oninput=upd; $(id).onchange=upd; });
  $('lSant').onchange=function(){ custom={ora:'',metru:''}; editing={ora:false,metru:false}; box('ora'); box('metru'); upd(); };
  ['ora','metru'].forEach(function(k){ if(has(custom[k]) && fixPret(k)!=null && num(custom[k])===fixPret(k)) custom[k]=''; });
  box('ora'); box('metru'); upd();
  $('lCancel').onclick=inchide;
  $('lSave').onclick=function(){
    var e='';
    if(editing[tip] && !confirma(tip)) return;          // prețul scris dar neconfirmat se ia automat
    if(!v('lData')) e='Pune data.'; else if(!v('lSant')) e='Alege șantierul.'; else if(!(num(v('lPers'))>0)) e='Pune câte persoane au lucrat.';
    else if(!(num(v('lOre'))>0)) e='Pune orele totale.'; else if(tip==='metru' && !(num(v('lMetri'))>0)) e='Pune metrii făcuți.';
    else if(curPret(tip)==null) e= tip==='metru' ? 'Pune prețul pe m² (✏️).' : 'Pune prețul pe oră (✏️).';
    if(e){ $('fErr').textContent=e; return; }
    salvare('Lucru',Object.assign({id:r.id||'',data:v('lData'),santier:v('lSant'),tip:tip,persoane:String(num(v('lPers'))),ore:String(num(v('lOre'))),metri:tip==='metru'?String(num(v('lMetri'))):'',pret_metru:tip==='metru'?custom.metru:'',tarif_ora:tip==='ora'?custom.ora:'',nota:v('lNota')}, notaStare(r, v('lNota'))),this);
  };
  if(!nou) $('lDel').onclick=function(){ eliminaPontaj(r); };
}

/* ---- Costuri ---- */
function costPentru(data,sant){ return S.data.costuri.find(function(c){ return c.data===data && c.santier===sant; }); }
/* Contribuții pe oră lucrată: suma stă în foaia de date (Setări → șantier), nu în codul paginii. */
function contribOra(sant){ var s=santier(sant); return (s && has(s.contrib_ora)) ? num(s.contrib_ora) : 0; }
function oreZi(data,sant){ return S.data.lucru.filter(function(x){ return x.data===data && x.santier===sant; }).reduce(function(a,x){ return a+num(x.ore); },0); }
function contribCalc(data,sant){ return Math.round(oreZi(data,sant)*contribOra(sant)*100)/100; }
var CAMP_COST=[
  {id:'cSal',k:'salarii',t:'Salarii €'},
  {id:'cCon',k:'contributii',t:'Contribuții €'},
  {id:'cChi',k:'chirie',t:'Chirie / cazare €'},
  {id:'cCar',k:'carburant',t:'Carburant și autostradă €'},
  {id:'cScu',k:'scule',t:'Scule și echipament de protecție €'},
  {id:'cGen',k:'generale',t:'Cheltuieli generale €'}
];
function virg(x){ return has(x)? String(x).replace('.',',') : ''; }
function costGol(data,sant){ return {data:data,santier:sant,salarii:'',contributii:'',chirie:'',carburant:'',scule:'',generale:'',generale_desc:'',nota:''}; }
function formCost(_, data, sant){
  data=data||todayIso(); sant=sant||(santiereOrd().find(function(s){return s.activ!=='nu';})||{}).nume||'';
  var c=costPentru(data,sant), nou=!c; c=c||costGol(data,sant);
  var contribManual=!!(c.id && has(c.contributii) && num(c.contributii)!==contribCalc(c.data,c.santier));
  deschide('<h2>Produs, cheltuieli, rămas</h2>'+
    '<div class="two"><label class="field"><span>Data</span><input id="cData" type="date" value="'+esc(c.data)+'"></label>'+
    '</div>'+santierPick('cSant', c.santier)+
    '<div class="crows">'+CAMP_COST.map(function(f){ return '<label class="crow"><span>'+f.t.replace(' €','')+'</span><input id="'+f.id+'" inputmode="decimal" value="'+esc(virg(c[f.k]))+'" placeholder="0"><em>€</em></label>'; }).join('')+'</div>'+
    '<div class="small muted" id="cConInfo" style="margin:-2px 4px 6px"></div>'+
    '<label class="field"><span>Descriere cheltuieli generale</span><input id="cGenD" value="'+esc(c.generale_desc)+'" placeholder="ex. telefon, consumabile, neprevăzute"></label>'+
    '<div class="small muted" style="margin:0 4px">Materialele nu intră aici.</div>'+
    '<label class="field"><span>Notă</span><input id="cNota" value="'+esc(c.nota)+'"></label>'+
    '<div class="live" id="cLive"></div><div class="err" id="fErr"></div>'+
    '<div class="actions"><button class="btn primary block" id="cSave">Salvează</button>'+'<button class="btn danger block'+(nou?' hidden':'')+'" id="cDel">Șterge cheltuielile</button>'+'<button class="btn block" id="cCancel">Renunță</button></div>');
  function totalForm(){ return CAMP_COST.reduce(function(a,f){ return a+num(v(f.id)); },0); }
  function infoContrib(){
    var d=v('cData'), s=v('cSant'), o=oreZi(d,s), r=contribOra(s);
    $('cConInfo').textContent = contribManual
      ? 'Contribuții puse de mână. Calculul lui Cătălin ar da '+eur(contribCalc(d,s))+'.'
      : (r>0 ? 'Contribuții calculate singure: '+nr(o)+' ore × '+eur(r)+' pe oră. Le poți schimba.' : 'Contribuții: suma pe oră nu e pusă la acest șantier (Setări).');
  }
  function upd(){
    var d=v('cData'), s=v('cSant');
    var x=grupuri().find(function(g){ return g.data===d && g.santier===s; }) || {produs:0,ore:0,areMetru:false,lucru:[]};
    var tot=totalForm(), ram=x.produs-tot, po=x.ore>0?ram/x.ore:null;
    var fake={areMetru:x.areMetru,peOra:po,cost:{},santier:s,ramas:ram}, sem=semafor(fake);
    $('cLive').innerHTML=(x.lucru&&x.lucru.length?'':'<div class="small down" style="margin-bottom:6px">În ziua asta nu e trecut încă pontajul.</div>')+
      '<div class="row"><span class="muted">Produs</span><b class="num">'+eur(x.produs)+'</b></div>'+
      '<div class="row"><span class="muted">Cheltuieli</span><b class="num">'+eur(tot)+'</b></div>'+
      '<div class="row"><span class="muted">Rămas</span><b class="num">'+eur(ram)+'</b></div>'+
      '<div class="row"><span class="muted">Rămas pe oră</span><b class="num">'+(sem?'<span class="dot '+semCls(sem)+'"></span> ':'')+(po!=null?eur(po):'—')+'</b></div>';
    infoContrib();
  }
  function puneContribAuto(){ if(!contribManual){ var val=contribCalc(v('cData'),v('cSant')); $('cCon').value= val? String(val).replace('.',',') : ''; } }
  function schimbatCheia(){
    var d=v('cData'), s=v('cSant'), x=costPentru(d,s);
    c = x || costGol(d,s);
    CAMP_COST.forEach(function(f){ $(f.id).value=virg(c[f.k]); });
    $('cGenD').value=c.generale_desc||''; $('cNota').value=c.nota||'';
    contribManual=!!(c.id && has(c.contributii) && num(c.contributii)!==contribCalc(d,s));
    if(!c.id || !has(c.contributii)) puneContribAuto();
    var del=$('cDel'); if(del) del.classList.toggle('hidden', !c.id);
    upd();
  }
  CAMP_COST.forEach(function(f){ $(f.id).oninput=upd; });
  $('cCon').oninput=function(){ contribManual=true; upd(); };
  ['cData','cSant'].forEach(function(id){ $(id).onchange=schimbatCheia; });
  if(!c.id || !has(c.contributii)) puneContribAuto();
  upd();
  $('cCancel').onclick=inchide;
  $('cSave').onclick=function(){
    var d=v('cData'), s=v('cSant');
    if(!d||!s){ $('fErr').textContent='Pune data și șantierul.'; return; }
    if(!S.data.lucru.some(function(x){ return x.data===d && x.santier===s; })){ $('fErr').textContent='Trece întâi pontajul pentru '+s+', '+zi(d)+'. Cheltuielile se pun doar pe zile cu pontaj.'; return; }
    var alt=costPentru(d,s);
    if(alt && alt.id!==c.id){ $('fErr').textContent='Pentru '+s+', '+zi(d)+' există deja cheltuieli. Deschide-le pe acelea din „Costuri”.'; return; }
    if(num(v('cGen'))>0 && !v('cGenD')){ $('fErr').textContent='Scrie pe scurt ce sunt cheltuielile generale.'; return; }
    var rand={id:c.id||'',data:d,santier:s,nota:v('cNota'),generale_desc:v('cGenD')};
    CAMP_COST.forEach(function(f){ rand[f.k]=String(num(v(f.id))); });
    Object.assign(rand, notaStare(c, v('cNota')));
    salvare('Costuri',rand,this);
  };
  $('cDel').onclick=function(){ if(c.id) stergere('Costuri',c.id,this,'Ștergi cheltuielile pentru '+c.santier+', '+zi(c.data)+'?'); };
}

/* ---- Șantiere ---- */
function folosit(nume){ return S.data.lucru.some(function(r){return r.santier===nume;}) || S.data.costuri.some(function(r){return r.santier===nume;}); }
function formSantier(s){
  var nou=!s; s=s||{nume:'',tarif_ora:'',pret_metru:'',tinta_ora:'45',galben_de_la:'40',activ:'da'};
  var blocat=!nou && folosit(s.nume);
  deschide('<h2>'+(nou?'Șantier nou':esc(s.nume))+'</h2>'+
    '<label class="field"><span>Nume'+(blocat?' (are deja zile trecute, nu se mai schimbă)':'')+'</span><input id="sNume" value="'+esc(s.nume)+'"'+(blocat?' disabled':'')+'></label>'+
    '<div class="two"><label class="field"><span>Tarif la oră €</span><input id="sOra" inputmode="decimal" value="'+esc(s.tarif_ora)+'"></label>'+
    '<label class="field"><span>Preț la metru propus €/m²</span><input id="sMetru" inputmode="decimal" value="'+esc(virg(s.pret_metru))+'"></label>'+
    '</div>'+
    '<div class="small muted" style="margin:-4px 4px 8px">La metru, prețul se alege la fiecare pontaj; acesta e doar cel propus.</div>'+
    '<label class="field"><span>Contribuții € pe oră lucrată</span><input id="sCon" inputmode="decimal" value="'+esc(virg(s.contrib_ora))+'"></label>'+
    '<div class="small muted" style="margin:-4px 4px 8px">După metoda lui Cătălin. Se înmulțește cu orele din pontaj.</div>'+
    '<label class="field"><span>Stare</span><select id="sActiv"><option value="da"'+(s.activ!=='nu'?' selected':'')+'>Activ</option><option value="nu"'+(s.activ==='nu'?' selected':'')+'>Oprit (nu mai apare în listă)</option></select></label>'+
    '<div class="small muted" style="margin:0 4px">Tariful schimbat se aplică și zilelor deja trecute la acest șantier.</div>'+
    '<div class="err" id="fErr"></div>'+
    '<div class="actions"><button class="btn primary block" id="sSave">Salvează</button>'+(nou||blocat?'':'<button class="btn danger block" id="sDel">Șterge șantierul</button>')+'<button class="btn block" id="sCancel">Renunță</button></div>');
  $('sCancel').onclick=inchide;
  $('sSave').onclick=function(){
    var n=blocat? s.nume : v('sNume');
    if(!n){ $('fErr').textContent='Pune numele.'; return; }
    var dubla=S.data.santiere.find(function(o){ return o.nume.toLowerCase()===n.toLowerCase() && o.id!==s.id; });
    if(dubla){ $('fErr').textContent='Există deja un șantier cu numele ăsta.'; return; }
    if(!has(v('sOra')) && !has(v('sMetru'))){ $('fErr').textContent='Pune cel puțin un tarif (la oră sau la metru).'; return; }
    function n2(id){ return has(v(id))? String(num(v(id))) : ''; }
    salvare('Santiere',{id:s.id||'',nume:n,tarif_ora:n2('sOra'),pret_metru:n2('sMetru'),tinta_ora:s.tinta_ora||'',galben_de_la:s.galben_de_la||'',activ:v('sActiv'),contrib_ora:n2('sCon'),ordine: has(s.ordine)? s.ordine : String(S.data.santiere.reduce(function(m,o){ return Math.max(m, num(o.ordine)); },0)+1)},this);
  };
  if(!nou && !blocat) $('sDel').onclick=function(){ stergere('Santiere',s.id,this,'Ștergi șantierul '+s.nume+'?'); };
}

/* ---- Parole ---- */
function formParole(){
  deschide('<h2>Schimbă parolele</h2><p class="muted small">Lasă gol ce nu schimbi. După salvare, amândoi intrați din nou cu parola nouă.</p>'+
    '<label class="field"><span>Parolă nouă Silviu</span><input id="nS" type="password" autocomplete="new-password"></label>'+
    '<label class="field"><span>Parolă nouă Cătălin</span><input id="nC" type="password" autocomplete="new-password"></label>'+
    '<div class="err" id="fErr"></div><div class="actions"><button class="btn primary block" id="pSave">Salvează</button><button class="btn block" id="pCancel">Renunță</button></div>');
  $('pCancel').onclick=inchide;
  $('pSave').onclick=function(){
    var b=this, s=$('nS').value, c=$('nC').value;
    if(!s && !c){ $('fErr').textContent='Pune cel puțin o parolă nouă.'; return; }
    if((s && s.length<6)||(c && c.length<6)){ $('fErr').textContent='Cel puțin 6 caractere.'; return; }
    b.disabled=true;
    call('api',S.token,'parole',{silviu:s,catalin:c}).then(function(){ inchide(); uita(); arata('vLogin'); toast('Parolele s-au schimbat. Intră din nou.'); })
      .catch(function(e){ if(!sesiune(e)) $('fErr').textContent=errText(e); }).then(function(){ b.disabled=false; });
  };
}

start();
</script>
